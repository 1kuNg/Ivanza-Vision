name: Publish compiled frontend for help update
on:
  pull_request:
    paths:
      - '.github/workflows/build-assets-once.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ajuda-facil-zoom-inspecao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Commit built dist to this branch
        shell: bash
        run: |
          git add -A frontend/dist
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh compiled frontend for easy help and zoom'
            git push origin HEAD:feature/ajuda-facil-zoom-inspecao
          fi
