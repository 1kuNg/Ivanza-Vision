name: Verify Few-Shot demo samples
on:
  pull_request:
    paths:
      - 'sku_demos.py'
      - 'tests/test_sku_demos.py'
      - '.github/workflows/verify-sku-demo.yml'
  push:
    branches: [main]
    paths:
      - 'sku_demos.py'
      - 'tests/test_sku_demos.py'
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light test dependencies
        run: python -m pip install "pillow>=10,<13" pytest
      - name: Validate demonstration datasets
        run: python -m pytest tests/test_sku_demos.py -q
